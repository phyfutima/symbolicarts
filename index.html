<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Symbolic Arts</title>
  <meta name="description" content="Symbolic Arts FX – creature/makeup FX, animatronics, sculpture, and more." />
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body>
  <header class="site-header">
  <div class="header-inner">
    <div class="header-brand">
      <img src="assets/img/header.png" alt="Symbolic Arts" class="brand-logo">
    </div>

  </div>
</header>


  <main>
    <section id="gallery" class="hero">
      <div class="hero-viewport">
        <div class="hero-track" id="heroTrack">
          <div class="hero-slide"><img src="assets/img/gallery332.jpg" alt="Gallery slide 1" loading="eager"></div>
          <div class="hero-slide"><img src="assets/img/gallery132.jpg" alt="Gallery slide 2" loading="lazy"></div>
          <div class="hero-slide"><img src="assets/img/gallery232.jpg" alt="Gallery slide 3" loading="lazy"></div>
          <div class="hero-slide"><img src="assets/img/gallery432.jpg" alt="Gallery slide 4" loading="lazy"></div>
        </div>

        <button class="hero-btn prev" type="button" aria-label="Previous slide" id="prevBtn">‹</button>
        <button class="hero-btn next" type="button" aria-label="Next slide" id="nextBtn">›</button>

        <div class="hero-dots" id="heroDots" aria-label="Slide navigation"></div>
      </div>
    </section>

    <section id="contact" class="contact">
  <div class="contact-overlay"></div>

  <div class="contact-form-wrap">
    <h2 class="contact-title">Contact Us</h2>

    <form class="contact-form" action="https://formspree.io/f/xbdykovv" method="POST">
      <div class="row two">
        <div class="field">
          <label>Name <span>(required)</span></label>
          <input type="text" name="first_name" placeholder="First Name" required>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <input type="text" name="last_name" placeholder="Last Name" required>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Email <span>(required)</span></label>
          <input type="email" name="email" required>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Subject <span>(required)</span></label>
          <input type="text" name="subject" required>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Message <span>(required)</span></label>
          <textarea name="message" rows="6" required></textarea>
        </div>
      </div>

      <button class="submit-btn" type="submit">SUBMIT</button>
<input type="hidden" name="_subject" value="Form Submission - Contact - Symbolic Arts">
    </form>
  </div>
</section>

<section class="logo-band">
  <img src="assets/img/salogo.png" alt="Symbolic Arts">
</section>


    <section id="lsa" style="height:1px;"></section>
  </main>

  <footer class="footer">
  <div class="footer-icons">
    <a class="icon" href="https://www.instagram.com/symbolicartsfx/" target="_blank" rel="noopener" aria-label="Instagram">◎</a>
    <a class="icon" href="https://www.facebook.com/SymbolicArtsFX/" target="_blank" rel="noopener" aria-label="Facebook">f</a>
    <a class="icon" href="mailto:info@symbolicartsfx.com" aria-label="Email">✉</a>
  </div>

  <div class="footer-text">
    <div>Copyright ©2026 Symbolic Arts</div>
    <a class="privacy" href="https://symbolicarts.squarespace.com/privacy-policy" target="_blank" rel="noopener">PRIVACY POLICY</a>
  </div>
</footer>


  <script>
    (function () {
      const track = document.getElementById('heroTrack');
      const slides = Array.from(track.querySelectorAll('.hero-slide'));
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const dotsWrap = document.getElementById('heroDots');

      let index = 0;
      let timer = null;
      const AUTOPLAY_MS = 5000;

      // Build dots
      const dots = slides.map((_, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'dot';
        b.setAttribute('aria-label', 'Go to slide ' + (i + 1));
        b.addEventListener('click', () => goTo(i, true));
        dotsWrap.appendChild(b);
        return b;
      });

      function render() {
        track.style.transform = `translateX(${-index * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === index));
      }

      function goTo(i, userAction) {
        index = (i + slides.length) % slides.length;
        render();
        if (userAction) restartAutoplay();
      }

      function next(userAction) { goTo(index + 1, userAction); }
      function prev(userAction) { goTo(index - 1, userAction); }

      function startAutoplay() {
        stopAutoplay();
        timer = setInterval(() => next(false), AUTOPLAY_MS);
      }

      function stopAutoplay() {
        if (timer) clearInterval(timer);
        timer = null;
      }

      function restartAutoplay() {
        startAutoplay();
      }

      nextBtn.addEventListener('click', () => next(true));
      prevBtn.addEventListener('click', () => prev(true));

      // Pause on hover (desktop)
      const viewport = document.querySelector('.hero-viewport');
      viewport.addEventListener('mouseenter', stopAutoplay);
      viewport.addEventListener('mouseleave', startAutoplay);

      // Basic swipe (mobile)
      let startX = null;
      viewport.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, {passive:true});
      viewport.addEventListener('touchend', (e) => {
        if (startX === null) return;
        const endX = e.changedTouches[0].clientX;
        const dx = endX - startX;
        startX = null;
        if (Math.abs(dx) > 40) {
          (dx < 0) ? next(true) : prev(true);
        }
      }, {passive:true});

      // Init
      render();
      startAutoplay();
    })();
  </script>
</body>
</html>
