      <button class="submit-btn" type="submit">SUBMIT</button>
<input type="hidden" name="_subject" value="Form Submission - Contact - Symbolic Arts">

<script>
  // Basic email obfuscation: build mailto at runtime (removes raw address from HTML)
  (function () {
    var a = document.getElementById('emailLink');
    if (!a) return;
    var user = a.getAttribute('data-user');
    var domain = a.getAttribute('data-domain');
    var addr = user + '@' + domain;

    a.href = 'mailto:' + addr;
    a.removeAttribute('data-user');
    a.removeAttribute('data-domain');
  })();
</script>

  <script>
    (function () {
      const track = document.getElementById('heroTrack');
      const slides = Array.from(track.querySelectorAll('.hero-slide'));
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const dotsWrap = document.getElementById('heroDots');

      let index = 0;
      let timer = null;
      const AUTOPLAY_MS = 5000;

      // Build dots
      const dots = slides.map((_, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'dot';
        b.setAttribute('aria-label', 'Go to slide ' + (i + 1));
        b.addEventListener('click', () => goTo(i, true));
        dotsWrap.appendChild(b);
        return b;
      });

      function render() {
        track.style.transform = `translateX(${-index * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === index));
      }

      function goTo(i, userAction) {
        index = (i + slides.length) % slides.length;
        render();
        if (userAction) restartAutoplay();
      }

      function next(userAction) { goTo(index + 1, userAction); }
      function prev(userAction) { goTo(index - 1, userAction); }

      function startAutoplay() {
        stopAutoplay();
        timer = setInterval(() => next(false), AUTOPLAY_MS);
      }

      function stopAutoplay() {
        if (timer) clearInterval(timer);
        timer = null;
      }

      function restartAutoplay() {
        startAutoplay();
      }

      nextBtn.addEventListener('click', () => next(true));
      prevBtn.addEventListener('click', () => prev(true));

      // Pause on hover (desktop)
      const viewport = document.querySelector('.hero-viewport');
      viewport.addEventListener('mouseenter', stopAutoplay);
      viewport.addEventListener('mouseleave', startAutoplay);

      // Basic swipe (mobile)
      let startX = null;
      viewport.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, {passive:true});
      viewport.addEventListener('touchend', (e) => {
        if (startX === null) return;
        const endX = e.changedTouches[0].clientX;
        const dx = endX - startX;
        startX = null;
        if (Math.abs(dx) > 40) {
          (dx < 0) ? next(true) : prev(true);
        }
      }, {passive:true});

      // Init
      render();
      startAutoplay();
    })();
  </script>
<script>
(() => {
  const section = document.querySelector('.contact');
  if (!section) return;

  // Tuning (these are the only two knobs)
  const SPEED = 0.18;     // 0.12–0.25 is typical; lower = “farther away”
  const BASE_Y = -80;       // starting offset in pixels

  let ticking = false;

  function update() {
    ticking = false;

    const rect = section.getBoundingClientRect();
    const scrollY = window.scrollY || window.pageYOffset;

    // section's top position in the document
    const sectionTop = scrollY + rect.top;

    // how far the page has scrolled past the section top
    const delta = scrollY - sectionTop;

    // parallax offset (background moves slower than content)
    const bgY = BASE_Y + delta * SPEED;

    section.style.backgroundPosition = `center ${bgY}px`;
  }

  function onScroll() {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(update);
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);

  // run once on load
  update();
})();
</script>
