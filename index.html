<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Symbolic Arts</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Symbolic Arts</div>

      <nav class="topnav">
        <a href="#gallery">Gallery</a>
        <a href="#contact">Contact</a>
        <a href="#lsa">lsa</a>
      </nav>

      <div class="social">
        <a href="https://www.instagram.com/symbolicartsfx/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://www.facebook.com/SymbolicArtsFX/" target="_blank" rel="noopener">Facebook</a>
      </div>
    </div>
  </header>

  <main>
    <section id="gallery" class="gallery">
      <div class="gallery-grid">
        <div class="big">
          <img src="assets/img/gallery332.jpg" alt="Gallery image 1" loading="eager">
        </div>

        <div class="small s1"><img src="assets/img/gallery132.jpg" alt="Gallery image 2" loading="lazy"></div>
        <div class="small s2"><img src="assets/img/gallery232.jpg" alt="Gallery image 3" loading="lazy"></div>
        <div class="small s3"><img src="assets/img/gallery432.jpg" alt="Gallery image 4" loading="lazy"></div>
      </div>
    </section>

    <section id="contact" class="contact">
      <div class="contact-overlay"></div>

      <div class="contact-inner">
        <div class="contact-card">
          <h2>Contact Us</h2>
          <p>
            Symbolic Arts<br>
            9232 Independence Avenue, Suite 101,<br>
            Chatsworth, CA 91311,<br>
            USA
          </p>
          <p>
            <a href="tel:+18188185200">818-818-5200</a><br>
            <a href="mailto:info@symbolicartsfx.com">info@symbolicartsfx.com</a>
          </p>
          <p class="muted">Hours</p>
        </div>

        <img class="contact-logo" src="assets/img/salogo.png" alt="Symbolic Arts logo" loading="lazy">
      </div>
    </section>

    <section id="lsa" style="height:1px;"></section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div>Copyright ©2025 Symbolic Arts</div>
      <div><a href="https://symbolicarts.squarespace.com/privacy-policy" target="_blank" rel="noopener">PRIVACY POLICY</a></div>
    </div>
  </footer>

</body>
</html>
