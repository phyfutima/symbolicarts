<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Symbolic Arts</title>
  <meta name="description" content="Symbolic Arts FX – creature/makeup FX, animatronics, sculpture, and more." />
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Symbolic Arts</div>

      <nav class="topnav">
        <a href="#gallery">Gallery</a>
        <a href="#contact">Contact</a>
        <a href="#lsa">lsa</a>
      </nav>

      <div class="social">
        <a href="https://www.instagram.com/symbolicartsfx/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://www.facebook.com/SymbolicArtsFX/" target="_blank" rel="noopener">Facebook</a>
      </div>
    </div>
  </header>

  <main>
    <!-- GALLERY: big-left + three-right -->
    <section id="gallery" class="gallery">
      <div class="gallery-grid">
        <a class="g big" href="assets/img/gallery332.jpg">
          <img src="assets/img/gallery332.jpg" alt="Gallery image 1" loading="eager">
        </a>

        <a class="g s1" href="assets/img/gallery132.jpg">
          <img src="assets/img/gallery132.jpg" alt="Gallery image 2" loading="lazy">
        </a>

        <a class="g s2" href="assets/img/gallery232.jpg">
          <img src="assets/img/gallery232.jpg" alt="Gallery image 3" loading="lazy">
        </a>

        <a class="g s3" href="assets/img/gallery432.jpg">
          <img src="assets/img/gallery432.jpg" alt="Gallery image 4" loading="lazy">
        </a>
      </div>
    </section>

    <!-- CONTACT: background image + dark overlay -->
    <section id="contact" class="contact">
      <div class="contact-overlay"></div>

      <div class="contact-inner">
        <div class="contact-card">
          <h2>Contact Us</h2>

          <div class="contact-text">
            <div>Symbolic Arts</div>
            <div>9232 Independence Avenue, Suite 101,</div>
            <div>Chatsworth, CA 91311,</div>
            <div>USA</div>
            <div class="spacer"></div>
            <div><a href="tel:+18188185200">818-818-5200</a></div>
            <div><a href="mailto:info@symbolicartsfx.com">info@symbolicartsfx.com</a></div>
            <div class="spacer"></div>
            <div class="muted">Hours</div>
          </div>
        </div>

        <img class="contact-logo" src="assets/img/salogo.png" alt="Symbolic Arts logo" loading="lazy">
      </div>
    </section>

    <section id="lsa" class="lsa-spacer"></section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div>Copyright ©2025 Symbolic Arts</div>
      <div><a href="https://symbolicarts.squarespace.com/privacy-policy" target="_blank" rel="noopener">PRIVACY POLICY</a></div>
    </div>
  </footer>
</body>
</html>
