<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Symbolic Arts</title>
  <meta name="description" content="SYMBOLIC ARTS is an entertainment design and build studio. Specializing in Creature/Make-up FX, animatronics, sculpture, and more." />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="#top">Symbolic Arts</a>

      <nav class="nav">
        <a href="#gallery">Gallery</a>
        <a href="#contact">Contact</a>
      </nav>

      <div class="social">
        <a href="https://www.instagram.com/symbolicartsfx/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://www.facebook.com/SymbolicArtsFX/" target="_blank" rel="noopener">Facebook</a>
      </div>
    </div>
  </header>

  <!-- Optional hero image. If you don't have header.jpg, you can delete this div. -->
  <div class="hero"></div>

  <main id="top" class="container">
    <section id="gallery" class="section">
      <div class="gallery-grid">
        <figure class="tile"><img src="assets/img/gallery332.jpg" alt="Gallery image 1" loading="lazy"></figure>
        <figure class="tile"><img src="assets/img/gallery132.jpg" alt="Gallery image 2" loading="lazy"></figure>
        <figure class="tile"><img src="assets/img/gallery232.jpg" alt="Gallery image 3" loading="lazy"></figure>
        <figure class="tile"><img src="assets/img/gallery432.jpg" alt="Gallery image 4" loading="lazy"></figure>
      </div>
    </section>

    <section id="contact" class="contact">
      <div class="contact-inner">
        <div class="contact-card">
          <h2>Contact Us</h2>
          <p>
            Symbolic Arts<br>
            9232 Independence Avenue, Suite 101,<br>
            Chatsworth, CA 91311,<br>
            USA
          </p>
          <p>
            <a href="tel:+18188185200">818-818-5200</a><br>
            <a href="mailto:info@symbolicartsfx.com">info@symbolicartsfx.com</a>
          </p>
          <p class="hours">Hours</p>
        </div>

        <img class="logo" src="assets/img/salogo.png" alt="Symbolic Arts logo" loading="lazy">
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div>Copyright ©2025 Symbolic Arts</div>
      <div><a href="https://symbolicarts.squarespace.com/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a></div>
    </div>
  </footer>
</body>
</html>
